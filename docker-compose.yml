# Local stack: the hub on Postgres, with the insurance-core pack calling its mock API over the network
# (other packs use their in-process fakes). Dev auth: do not expose this.
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: hub}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "hub"], interval: 5s, retries: 10}
  insurance-mock:
    build: .
    working_dir: /app/packs/insurance-core
    command: ["python", "-m", "uvicorn", "mock_api.app:app", "--host", "0.0.0.0", "--port", "8090"]
  hub:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      insurance-mock: {condition: service_started}
    environment:
      HUB_AUTH: dev
      HUB_ENV: dev
      HUB_STORE: postgresql+psycopg://hub:hub@postgres:5432/hub
      INSURANCE_CORE_URL: http://insurance-mock:8090
    ports: ["8000:8080"]

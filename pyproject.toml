[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-connector-hub"
dynamic = ["version"]
description = "Governed MCP connector hub for enterprise agents: per-user identity, policy and approvals, audit, and offline fakes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Koushik Mohan" }]
keywords = ["mcp", "agents", "salesforce", "servicenow", "sap", "oauth", "token-exchange", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
hub = "connector_hub.cli:main"

[project.urls]
Repository = "https://github.com/koushikmohanbhat/agent-connector-hub"

[tool.hatch.version]
path = "src/connector_hub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/connector_hub"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "connector_hub/packs"
"profiles" = "connector_hub/profiles"
"templates" = "connector_hub/templates"
"hub.yaml" = "connector_hub/hub.yaml"
"deploy" = "connector_hub/deploy"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S105", "S106", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/connector_hub/devpage.py" = ["E501"]
# SOQL values are quoted and escaped by q() / like(); field and object names are constants.
"packs/salesforce-service/backend.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
